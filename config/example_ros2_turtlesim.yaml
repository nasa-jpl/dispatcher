# ============================================================================
# ROS 2 turtlesim -- shell items, pgrep-based status, and control scripts.
# ============================================================================
#
# Runs out of the box against stock ROS 2 packages; no custom package needed:
#
#   sudo apt install ros-$ROS_DISTRO-turtlesim ros-$ROS_DISTRO-rqt-graph
#
# Launch from the root of the colcon workspace that contains dispatcher:
#
#   source install/setup.bash
#   ros2 run dispatcher dispatcher --ros-args \
#     -p dispatcher_config_path:=src/dispatcher/config/example_ros2_turtlesim.yaml \
#     -p start_checked_on_startup:=true
#
# Start `turtlesim_node` first, then drive the turtle with the script buttons or
# with `draw_square` / `teleop`. The script buttons are no-ops (bounded by a
# timeout) while turtlesim is stopped.
#
# This file defines no `configurations`, so every item falls back to the
# implicit 'all' configuration and the configuration selector is not shown.

# ROS process items run `cd <workspace>` then `source install/setup.bash` before
# the command, so this must be the colcon workspace root. '.' works when
# dispatcher is launched from there.
workspace: .

nodes:

  # `type: shell` infers status from `pgrep <name>` instead of the ROS graph, so
  # the item name has to be the process name -- `turtlesim_node` here. Note that
  # `pgrep` matches against the 15-character comm field, so longer process names
  # will not match. Shell items also skip the workspace `source
  # install/setup.bash` step, inheriting whatever environment the tmux server
  # was started with.
  # The same process could instead be monitored through the ROS graph, as a ROS
  # item. Do not define both: they start the same executable, and each would
  # report the other's copy as online.
  #
  #   - name: turtlesim
  #     ros_nodes:
  #     - namespace: /
  #       name: turtlesim
  #     cmd: ros2 run turtlesim turtlesim_node
  - name: turtlesim_node
    type: shell
    cmd: ros2 run turtlesim turtlesim_node
    start_checked: true

  # A ROS item, monitored through the graph. `namespace: /` is required: matching
  # compares against the fully-qualified name, which is `/draw_square` for a node
  # in the root namespace. Omitting `namespace` defaults it to the empty string,
  # which never matches, and the status light stays red even though the node is
  # running.
  - name: draw_square
    ros_nodes:
    - namespace: /
      name: draw_square
    cmd: ros2 run turtlesim draw_square

  # `attach_on_start: true` opens a gnome-terminal attached to this item's tmux
  # session as soon as it starts, which teleop needs since it reads keystrokes
  # from the terminal.
  #
  # This item is named `teleop`, not `turtle_teleop_key`, on purpose: the status
  # check runs `pgrep <name>` against the 15-character comm field, which holds
  # the truncated `turtle_teleop_k`. `pgrep teleop` matches it as a substring,
  # while `pgrep turtle_teleop_key` is refused outright for being too long and
  # would leave the light permanently red.
  - name: teleop
    type: shell
    cmd: ros2 run turtlesim turtle_teleop_key
    attach_on_start: true

scripts:

# A script with `use_terminal: false` runs as a blocking system() call on the Qt
# main thread, so it MUST end in `&` or the dispatcher UI freezes until the
# command exits. Scripts with `use_terminal: true` are wrapped in
# `gnome-terminal --`, which returns immediately, so those do not need the `&`.
#
# `ros2 topic pub --once` waits indefinitely for a matching subscriber and
# `ros2 service call` waits indefinitely for the service, so each command is
# bounded with `--max-wait-time-secs` or `timeout`. Without that, pressing a
# button while turtlesim is stopped leaves a process spinning forever.
#
# Scripts are executed as `bash -c '<cmd>'`, so double quotes inside the command
# are fine but single quotes are not -- they close the wrapper. The YAML single
# quotes below are needed because those commands contain ': ', which YAML would
# otherwise read as a nested mapping.

  - name: rqt_graph
    cmd: ros2 run rqt_graph rqt_graph &
    icon: :/icons/plot.png
    row: 0
    column: 0
    use_terminal: false

  - name: drive forward
    cmd: 'ros2 topic pub --once --max-wait-time-secs 5 /turtle1/cmd_vel geometry_msgs/msg/Twist "{linear: {x: 2.0}, angular: {z: 1.0}}" &'
    icon: :/icons/forward.png
    row: 0
    column: 1
    use_terminal: false

  - name: spawn turtle2
    cmd: 'timeout 5 ros2 service call /spawn turtlesim/srv/Spawn "{x: 4.0, y: 2.0, theta: 0.0, name: turtle2}" &'
    icon: :/icons/circle.png
    row: 1
    column: 0
    use_terminal: false

  # SetPen also has an `off` field, deliberately left out here: `ros2 service
  # call` parses the request with YAML 1.1, which reads a bare `off` key as the
  # boolean false rather than a field name and fails with "attribute name must
  # be string, not 'bool'". Omitting it takes the default of 0 (pen down).
  - name: set pen red
    cmd: 'timeout 5 ros2 service call /turtle1/set_pen turtlesim/srv/SetPen "{r: 255, g: 0, b: 0, width: 5}" &'
    icon: :/icons/line.png
    row: 1
    column: 1
    use_terminal: false

  - name: clear
    cmd: timeout 5 ros2 service call /clear std_srvs/srv/Empty "{}" &
    icon: :/icons/waste.png
    row: 2
    column: 0
    use_terminal: false

  - name: reset
    cmd: timeout 5 ros2 service call /reset std_srvs/srv/Empty "{}" &
    icon: :/icons/reset.png
    row: 2
    column: 1
    use_terminal: false

  - name: echo /turtle1/pose
    cmd: ros2 topic echo /turtle1/pose
    icon: :/icons/terminal.png
    row: 3
    column: 0
    use_terminal: true

  - name: graph summary
    cmd: ros2 node list && echo && ros2 topic list && echo && ros2 service list && read -n 1 -s -p "Press any key to close"
    icon: :/icons/source_code.png
    row: 3
    column: 1
    use_terminal: true
